[package]
name = "margen-desktop"
version = "1.12.3"
edition = "2021"
description = "MARGEN · Estudio de escritura"

[lib]
name = "margen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4"] }

# Evita que otro Cargo.toml del repositorio capture este backend.
[workspace]
resolver = "2"
